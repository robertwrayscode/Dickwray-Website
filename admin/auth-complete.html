<!DOCTYPE html>
<html>
<head>
  <title>Authenticating...</title>
</head>
<body>
  <p id="msg">Completing authentication...</p>
  <script>
    (function () {
      var hash = window.location.hash.substring(1);
      var params = new URLSearchParams(hash);
      var token = params.get('token');
      var provider = params.get('provider') || 'github';
      var error = params.get('error');

      if (error) {
        var msg = 'authorization:github:error:' + JSON.stringify({ error: error });
        if (window.opener) {
          window.opener.postMessage(msg, '*');
          window.close();
        } else {
          localStorage.setItem('decap-cms-auth', JSON.stringify({ error: error }));
          document.getElementById('msg').innerText = 'Auth error: ' + error;
          try { window.close(); } catch(e) {}
        }
        return;
      }

      if (token) {
        var msg = 'authorization:github:success:' + JSON.stringify({ token: token, provider: provider });
        if (window.opener) {
          window.opener.postMessage(msg, '*');
          window.close();
        } else {
          localStorage.setItem('decap-cms-auth', JSON.stringify({ token: token, provider: provider }));
          document.getElementById('msg').innerText = 'Authentication successful! Redirecting to admin...';
          setTimeout(function() {
            window.location.href = window.location.pathname.replace('auth-complete.html', '') + '#/';
          }, 1000);
        }
      } else {
        document.getElementById('msg').innerText = 'No token received. Please try again.';
      }
    })();
  <\/script>
</body>
    </html>
