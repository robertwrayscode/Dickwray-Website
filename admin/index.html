<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dick Wray — Content Manager</title>
</head>
<body>
    <script>
      // Poll localStorage for OAuth token (fallback when window.opener is null)
      // Decap CMS requires a two-step handshake with messages from the OAuth proxy origin.
      // GitHub COOP headers break window.opener, so we dispatch synthetic MessageEvents.
      (function() {
        var OAUTH_ORIGIN = 'https://dickwray-oauth.robertwray.workers.dev';
        var poll = setInterval(function() {
          var auth = localStorage.getItem('decap-cms-auth');
          if (auth) {
            clearInterval(poll);
            localStorage.removeItem('decap-cms-auth');
            try {
              var data = JSON.parse(auth);
              if (data.token) {
                // Step 1: Fake the handshake that Decap expects from the popup
                var handshake = new MessageEvent('message', {
                  data: 'authorizing:github',
                  origin: OAUTH_ORIGIN
                });
                window.dispatchEvent(handshake);
                // Step 2: After a tick, send the auth success message
                setTimeout(function() {
                  var authMsg = new MessageEvent('message', {
                    data: 'authorization:github:success:' + JSON.stringify(data),
                    origin: OAUTH_ORIGIN
                  });
                  window.dispatchEvent(authMsg);
                }, 100);
              } else if (data.error) {
                var handshake = new MessageEvent('message', {
                  data: 'authorizing:github',
                  origin: OAUTH_ORIGIN
                });
                window.dispatchEvent(handshake);
                setTimeout(function() {
                  var errMsg = new MessageEvent('message', {
                    data: 'authorization:github:error:' + JSON.stringify(data),
                    origin: OAUTH_ORIGIN
                  });
                  window.dispatchEvent(errMsg);
                }, 100);
              }
            } catch(e) {}
          }
        }, 500);
        setTimeout(function() { clearInterval(poll); }, 120000);
      })();
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
