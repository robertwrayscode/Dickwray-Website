<!DOCTYPE html>
<html>
<head>
  <title>Authenticating...</title>
</head>
<body>
  <p id="msg">Completing authentication...</p>
  <script>
    (function () {
      var hash = window.location.hash.substring(1);
      var params = new URLSearchParams(hash);
      var token = params.get('token');
      var provider = params.get('provider') || 'github';
      var error = params.get('error');

      if (error) {
        document.getElementById('msg').innerText = 'Auth error: ' + error;
        return;
      }

      if (token) {
        // Set netlify-cms-user directly so Decap auto-logins on page load.
        // This is the key Decap CMS checks on startup.
        localStorage.setItem('netlify-cms-user', JSON.stringify({
          token: token,
          backendName: 'github'
        }));

        // Also set decap-cms-auth for the polling script fallback
        localStorage.setItem('decap-cms-auth', JSON.stringify({
          token: token,
          provider: provider
        }));

        // Try postMessage to opener (works when window.opener is intact)
        if (window.opener) {
          try {
            var msg = 'authorization:github:success:' + JSON.stringify({ token: token, provider: provider });
            window.opener.postMessage(msg, '*');
            window.close();
            return;
          } catch(e) {}
        }

        // Redirect to admin page (Decap will auto-login from netlify-cms-user)
        document.getElementById('msg').innerText = 'Authentication successful! Redirecting...';
        setTimeout(function() {
          window.location.href = window.location.pathname.replace('auth-complete.html', '') + '#/';
        }, 500);
      } else {
        document.getElementById('msg').innerText = 'No token received. Please try again.';
      }
    })();
  </script>
</body>
</html>
