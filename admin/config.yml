backend:
  name: github
  repo: robertwrayscode/Dickwray-Website
  branch: main
  base_url: https://dickwray-oauth.robertbwray.workers.dev
  auth_endpoint: /auth

media_folder: assets/images
public_folder: /assets/images

site_url: https://www.dickwray.com

collections:
  - label: "Biography"
    name: "bio"
    files:
      - label: "Biography"
        name: "bio"
        file: "_data/bio.json"
        format: json
        fields:
          - label: "Bio Paragraphs"
            name: "bio_paragraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }

  - label: "CV"
    name: "cv"
    files:
      - label: "CV"
        name: "cv"
        file: "_data/cv.json"
        format: json
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Born", name: "born", widget: "string" }
          - { label: "Died", name: "died", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Section heading", name: "title", widget: "string" }
              - label: "Entries"
                name: "items"
                widget: "list"
                required: false
                summary: "{{fields.year}} {{fields.text}}"
                fields:
                  - { label: "Year", name: "year", widget: "string", required: false }
                  - { label: "Description (*asterisks* = italic)", name: "text", widget: "string" }
              - { label: "Paragraph text (optional)", name: "text", widget: "text", required: false }

  - label: "Essays"
    name: "essays"
    files:
      - label: "Essays"
        name: "essays"
        file: "_data/essays.json"
        format: json
        fields:
          - label: "Essays"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Content", name: "content", widget: "text" }

  - label: "Interviews"
    name: "interviews"
    files:
      - label: "Interviews"
        name: "interviews"
        file: "_data/interviews.json"
        format: json
        fields:
          - label: "Interviews"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Author/Interviewer", name: "author", widget: "string" }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Cover Image", name: "cover_image", widget: "image", required: false }

  - label: "Publications"
    name: "publications"
    files:
      - label: "Publications"
        name: "publications"
        file: "_data/publications.json"
        format: json
        fields:
          - label: "Publications"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Author", name: "author", widget: "string", required: false }
              - { label: "Publication / Gallery", name: "publication", widget: "string", required: false }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Cover Image", name: "cover_image", widget: "image", required: false }

  - label: "Settings"
    name: "settings"
    files:
      - label: "Site Settings"
        name: "settings"
        file: "_data/settings.json"
        format: json
        fields:
          - { label: "Site Title", name: "site_title", widget: "string" }
          - { label: "Site Description", name: "site_description", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }

  # ---- Painting galleries -------------------------------------------------
  # Each gallery is a list of images in display order. Add an image with the
  # "+" button, upload the file, and fill in the caption fields. Drag to reorder.
  - label: "Galleries"
    name: "galleries"
    files:
      - label: "Watercolors"
        name: "watercolors"
        file: "_data/galleries/watercolors.json"
        format: json
        media_folder: "/assets/images/collections/watercolors"
        public_folder: "/assets/images/collections/watercolors"
        fields:
          - &gallery_images
            label: "Images"
            name: "images"
            widget: "list"
            summary: "{{fields.title}} — {{fields.image}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Year", name: "year", widget: "string", required: false }
              - { label: "Medium", name: "medium", widget: "string", required: false }
              - { label: "Dimensions", name: "dimensions", widget: "string", required: false }
              - { label: "Notes", name: "notes", widget: "text", required: false }
      - label: "Black & Whites"
        name: "black-and-whites"
        file: "_data/galleries/black-and-whites.json"
        format: json
        media_folder: "/assets/images/collections/black-and-whites"
        public_folder: "/assets/images/collections/black-and-whites"
        fields: [ *gallery_images ]
      - label: "Early Works"
        name: "early-works"
        file: "_data/galleries/early-works.json"
        format: json
        media_folder: "/assets/images/collections/early-works"
        public_folder: "/assets/images/collections/early-works"
        fields: [ *gallery_images ]
      - label: "Large Works"
        name: "large-works"
        file: "_data/galleries/large-works.json"
        format: json
        media_folder: "/assets/images/collections/large-works"
        public_folder: "/assets/images/collections/large-works"
        fields: [ *gallery_images ]
      - label: "Homepage Images (slideshow + featured grid)"
        name: "splash"
        file: "_data/galleries/splash.json"
        format: json
        media_folder: "/assets/images/collections/splash"
        public_folder: "/assets/images/collections/splash"
        fields: [ *gallery_images ]
