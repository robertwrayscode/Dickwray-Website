<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} — Dick Wray Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-brand">
                <i class="fas fa-palette"></i>
                <span>Dick Wray</span>
            </h1>
            <small class="sidebar-subtitle">Admin Tool</small>
        </div>

        <nav class="sidebar-nav">
            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
                <i class="fas fa-th-large"></i> Dashboard
            </a>

            <div class="nav-section">Images</div>
            {% for slug, name in collections.items() %}
            <a href="/images/{{ slug }}" class="nav-item nav-sub {% if request.path == '/images/' + slug %}active{% endif %}">
                <i class="fas fa-image"></i> {{ name }}
            </a>
            {% endfor %}

            <div class="nav-section">Content</div>
            <a href="/bio" class="nav-item {% if request.path == '/bio' %}active{% endif %}">
                <i class="fas fa-user"></i> Biography
            </a>
            <a href="/cv-edit" class="nav-item {% if request.path == '/cv-edit' %}active{% endif %}">
                <i class="fas fa-file-alt"></i> CV
            </a>
            <a href="/essays" class="nav-item {% if request.path == '/essays' %}active{% endif %}">
                <i class="fas fa-pen-fancy"></i> Essays
            </a>
            <a href="/interviews" class="nav-item {% if request.path == '/interviews' %}active{% endif %}">
                <i class="fas fa-microphone-alt"></i> Interviews
            </a>
            <a href="/publications" class="nav-item {% if request.path == '/publications' %}active{% endif %}">
                <i class="fas fa-book"></i> Publications
            </a>

            <div class="nav-section">System</div>
            <a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}">
                <i class="fas fa-cog"></i> Settings
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="top-bar">
            <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
                <i class="fas fa-bars"></i>
            </button>
            <div class="top-bar-title">{% block page_title %}Dashboard{% endblock %}</div>
            <div class="top-bar-actions">
                <button class="btn btn-sm btn-outline" onclick="buildSite()" id="btn-build">
                    <i class="fas fa-hammer"></i> Build
                </button>
                <button class="btn btn-sm btn-accent" onclick="deploySite()" id="btn-deploy">
                    <i class="fas fa-cloud-upload-alt"></i> Deploy
                </button>
                <a href="/preview" target="_blank" class="btn btn-sm btn-outline">
                    <i class="fas fa-eye"></i> Preview
                </a>
            </div>
        </header>

        <!-- Page Content -->
        <div class="page-content">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toasts"></div>

    <script>
        // ---- Toast notifications ----
        function showToast(message, type = 'success', duration = 4000) {
            const container = document.getElementById('toasts');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? 'check-circle' :
                         type === 'error'   ? 'exclamation-circle' :
                         'info-circle';
            toast.innerHTML = `<i class="fas fa-${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ---- Build ----
        async function buildSite() {
            const btn = document.getElementById('btn-build');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Building...';
            try {
                const res = await fetch('/build', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast('Site built successfully!');
                } else {
                    showToast('Build failed: ' + data.message, 'error', 6000);
                }
            } catch (e) {
                showToast('Build error: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-hammer"></i> Build';
            }
        }

        // ---- Deploy ----
        async function deploySite() {
            const btn = document.getElementById('btn-deploy');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deploying...';
            try {
                const res = await fetch('/deploy', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast('Deployed successfully!');
                } else {
                    showToast('Deploy issue: ' + data.message, 'error', 6000);
                }
            } catch (e) {
                showToast('Deploy error: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Deploy';
            }
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
