backend:
  name: github
  repo: robertwrayscode/Dickwray-Website
  branch: main
  base_url: https://dickwray-oauth.robertwray.workers.dev
  auth_endpoint: /auth

media_folder: assets/images
public_folder: /assets/images

site_url: https://www.dickwray.com

collections:
  - label: "Biography"
    name: "bio"
    files:
      - label: "Biography"
        name: "bio"
        file: "_data/bio.json"
        format: json
        fields:
          - label: "Bio Paragraphs"
            name: "bio_paragraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }

  - label: "Featured Gallery"
    name: "gallery"
    files:
      - label: "Featured Works"
        name: "featured"
        file: "_data/gallery.json"
        format: json
        fields:
          - label: "Featured Works"
            name: "featured_works"
            widget: "list"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Alt Text", name: "alt", widget: "string" }

  - label: "CV"
    name: "cv"
    files:
      - label: "CV"
        name: "cv"
        file: "_data/cv.json"
        format: json
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Born", name: "born", widget: "string" }
          - { label: "Died", name: "died", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - label: "Education"
            name: "education"
            widget: "list"
            fields:
              - { label: "Institution", name: "institution", widget: "string" }
              - { label: "Years", name: "years", widget: "string" }
              - { label: "Details", name: "details", widget: "string", required: false }
          - label: "Solo Exhibitions"
            name: "solo_exhibitions"
            widget: "list"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Exhibition", name: "exhibition", widget: "string" }
          - label: "Group Exhibitions"
            name: "group_exhibitions"
            widget: "list"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Exhibition", name: "exhibition", widget: "string" }
          - label: "Collections"
            name: "collections"
            widget: "list"
            field: { label: "Collection", name: "collection", widget: "string" }

  - label: "Essays"
    name: "essays"
    files:
      - label: "Essays"
        name: "essays"
        file: "_data/essays.json"
        format: json
        fields:
          - label: "Essays"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Content", name: "content", widget: "text" }

  - label: "Interviews"
    name: "interviews"
    files:
      - label: "Interviews"
        name: "interviews"
        file: "_data/interviews.json"
        format: json
        fields:
          - label: "Interviews"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Author/Interviewer", name: "author", widget: "string" }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Cover Image", name: "cover_image", widget: "image", required: false }

  - label: "Publications"
    name: "publications"
    files:
      - label: "Publications"
        name: "publications"
        file: "_data/publications.json"
        format: json
        fields:
          - label: "Publications"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Cover Image", name: "cover_image", widget: "image", required: false }

  - label: "Settings"
    name: "settings"
    files:
      - label: "Site Settings"
        name: "settings"
        file: "_data/settings.json"
        format: json
        fields:
          - { label: "Site Title", name: "site_title", widget: "string" }
          - { label: "Site Description", name: "site_description", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }
