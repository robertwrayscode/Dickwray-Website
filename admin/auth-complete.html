<!DOCTYPE html>
<html>
  <head>
      <title>Authenticating...</title>
  </head>
<body>
    <p id="msg">Completing authentication...</p>
    <script>
          (function () {
                  var hash = window.location.hash.substring(1);
                  var params = new URLSearchParams(hash);
                  var token = params.get('token');
                  var provider = params.get('provider') || 'github';
                  var error = params.get('error');

                  if (error) {
                            var msg = 'authorization:github:error:' + JSON.stringify({ error: error });
                            if (window.opener) {
                                        window.opener.postMessage(msg, '*');
                                        window.close();
                            } else {
                                        document.getElementById('msg').innerText = 'Auth error: ' + error;
                            }
                            return;
                  }

                  if (token) {
                            var msg = 'authorization:github:success:' + JSON.stringify({ token: token, provider: provider });
                            if (window.opener) {
                                        window.opener.postMessage(msg, '*');
                                        window.close();
                            } else {
                                        document.getElementById('msg').innerText =
                                                      'Authentication successful! You can close this window and refresh the admin page.';
                            }
                  } else {
                            document.getElementById('msg').innerText = 'No token received. Please try again.';
                  }
          })();
    </script>
</body>
</html>
